name: news
description: "A new Flutter project (news) that presents news from different sources"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.4
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.1
  dio: ^5.9.0
  provider: ^6.0.5
  cached_network_image: ^3.4.1
  timeago: ^3.7.1
  shared_preferences: ^2.2.2
  pull_to_refresh: ^2.0.0
  url_launcher: ^6.1.11



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/App_Icon.png"
